name: build-test-apk

# Compila un APK instalable del launcher + runtime Bionic para probar cambios
# (por ejemplo, la vibracion de mandos) sin depender de un PC Linux.
#
# - workflow_dispatch: se lanza a mano desde Actions o con `gh workflow run`.
# - Publica los APK como pre-release "apk-test-<n>" para descargarlos desde el telefono.
# - Firma: build_release_apk.sh genera una clave de desarrollo local si no hay secretos.
#
# El APK release sustituye a la app oficial (misma applicationId): hay que desinstalar
# antes y se pierden los datos. El APK debug usa applicationId .debug y convive con ella.

on:
  workflow_dispatch:

concurrency:
  group: build-test-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  ANDROID_PLATFORM: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  GOW3_BUILD_TYPE: Release

jobs:
  apk:
    name: Build installable arm64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up native dependency environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ci/environment.yml
          cache-environment: true
          init-shell: bash

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_PLATFORM }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}
            ndk;29.0.14206865

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang lld llvm cmake ninja-build meson pkg-config patchelf ccache \
            libxml2-utils unzip xz-utils zstd

      - name: Restore reproducible build caches
        uses: actions/cache@v4
        with:
          path: |
            .local-deps/android/src
            .local-deps/android/m2
            .local-deps/android/maven
            .local-deps/android/steam-libs
            .local-deps/android/bionic-prefix
            .local-deps/android/bionic-build
            out/bionic
            ~/.cache/ccache
            ~/.gradle/caches
          key: apk-${{ runner.os }}-${{ hashFiles('tools/android/**', 'cpu/**', 'gpu/CMakeLists.txt', 'gpu/third_party/**', 'ci/**') }}
          restore-keys: apk-${{ runner.os }}-

      - name: Build pinned host dependencies
        shell: bash -el {0}
        run: bash ci/setup-deps.sh "$CONDA_PREFIX"

      # Mismas variables que el workflow del upstream: build_bionic.sh busca los headers
      # only-header (robin-map, VMA, magic_enum, Boost) en $GOW3_ARM64_HEADERS y Boost en
      # GOW3_BOOST_DIR/GOW3_BOOST_HEADERS_DIR. Sin esto aborta con "No header-only packages".
      - name: Configure build environment
        shell: bash -el {0}
        run: |
          {
            echo "GOW3_ARM64_HEADERS=$CONDA_PREFIX"
            echo "GOW3_JOBS=$(nproc)"
            echo "GOW3_BUILD_TOOLS=$ANDROID_BUILD_TOOLS"
          } >> "$GITHUB_ENV"

      - name: Verify host header tree
        shell: bash -el {0}
        run: |
          set -euo pipefail
          share_dir="$CONDA_PREFIX/share/cmake"
          cmake_dir="$CONDA_PREFIX/lib/cmake"
          echo "== $cmake_dir =="
          ls -1 "$cmake_dir"
          echo "== $share_dir (tsl-robin-map / VulkanMemoryAllocator) =="
          ls -1 "$share_dir" 2>/dev/null || true
          [[ -d "$share_dir/tsl-robin-map" ]] || {
            echo "ERROR: tsl-robin-map not found in $share_dir; run ci/setup-deps.sh" >&2
            exit 1
          }
          boost_dir=$(compgen -G "$cmake_dir/Boost-*/BoostConfig.cmake" | head -1 | xargs dirname || true)
          boost_headers_dir=$(compgen -G "$cmake_dir/boost_headers-*/boost_headers-config.cmake" | head -1 | xargs dirname || true)
          if [[ -n $boost_dir ]]; then
            echo "GOW3_BOOST_DIR=$boost_dir" >> "$GITHUB_ENV"
            echo "GOW3_BOOST_HEADERS_DIR=${boost_headers_dir:-$boost_dir}" >> "$GITHUB_ENV"
            echo "Boost CMake package: $boost_dir"
          else
            echo "ERROR: no Boost-*/BoostConfig.cmake in $cmake_dir" >&2
            exit 1
          fi

      - name: Fetch Steam libraries
        shell: bash
        run: |
          # fetch_steam_libs.sh asume que .local-deps/android existe (en el CI del
          # upstream lo restaura la cache); en un runner limpio hay que crearlo.
          mkdir -p .local-deps/android
          # La resolucion del plugin de Maven ha fallado de forma intermitente en
          # runners limpios (NoPluginFoundForPrefix); se reintenta con repo local limpio.
          for attempt in 1 2 3; do
            if bash tools/android/inputs/fetch_steam_libs.sh; then
              exit 0
            fi
            echo "Steam fetch failed (attempt $attempt/3); retrying with a clean local repo" >&2
            rm -rf .local-deps/android/m2
            sleep 10
          done
          echo "Steam libraries could not be fetched; the debug APK will use the stub." >&2
          exit 0

      - name: Vendor the missing dxbc submodule
        shell: bash
        run: |
          set -euo pipefail
          # ducvd89/bloodframe fija el submódulo PancakeTAS/dxbc en 78ab59a8, pero ese
          # repositorio ya no existe (404) y un clon limpio no puede bajarlo. El port
          # AlkaidLab/lsfg-vk-android-legacy vendoriza las mismas fuentes de dxbc
          # (DXVK 2.6.2); se inyectan y se marca el submódulo como "no actualizar".
          src=.local-deps/android/src/bloodframe
          mkdir -p .local-deps/android/src
          [[ -d $src/.git ]] || git clone -q https://github.com/ducvd89/bloodframe.git "$src"
          git -C "$src" -c advice.detachedHead=false checkout -q \
            c29027555cfa8c9fc73c20f03816230becb9f469
          tmp=$(mktemp -d)
          curl -fsSL \
            "https://codeload.github.com/AlkaidLab/lsfg-vk-android-legacy/tar.gz/d35751e42ca44e11c46c7c33243faf7f88087081" \
            -o "$tmp/src.tar.gz"
          tar -xzf "$tmp/src.tar.gz" -C "$tmp"
          rm -rf "$src/thirdparty/dxbc"
          cp -a "$tmp"/lsfg-vk-android-legacy-*/thirdparty/dxbc "$src/thirdparty/dxbc"
          git -C "$src" config submodule.thirdparty/dxbc.update none
          test -f "$src/thirdparty/dxbc/CMakeLists.txt"
          test -f "$src/thirdparty/dxbc/LICENSE.md"
          echo "dxbc vendored: $(ls "$src/thirdparty/dxbc")"

      - name: Verify the NDK toolchain can link
        shell: bash -el {0}
        run: |
          set -euo pipefail
          tc="$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}"
          ldd "$tc/bin/clang" | head -20 || true
          "$tc/bin/aarch64-linux-android30-clang" --version
          printf 'int main(void){return 0;}\n' > /tmp/t.c
          "$tc/bin/aarch64-linux-android30-clang" /tmp/t.c -o /tmp/t
          file /tmp/t

      - name: Build the Bionic runtime
        shell: bash -el {0}
        run: |
          # FFmpeg's configure toma CFLAGS/CPPFLAGS/LDFLAGS del entorno y, con el env de
          # conda activo, puede heredar rutas/flags del compilador x86_64 del host y romper
          # el enlace cruzado a arm64 (C compiler test failed). El cruce ya lleva sus flags
          # por tanda de argumentos; aqui se limpian los del host.
          unset CFLAGS CPPFLAGS CXXFLAGS LDFLAGS LIBRARY_PATH
          if ! bash tools/android/build_bionic_deps.sh; then
            f=.local-deps/android/bionic-build/ffmpeg
            echo "=== ffmpeg configure output ==="
            tail -80 "$f/ffmpeg-configure.log" 2>&1 || true
            echo "=== ffbuild/config.log (head) ==="
            head -100 "$f/ffbuild/config.log" 2>&1 || true
            echo "=== ffbuild/config.log (tail) ==="
            tail -100 "$f/ffbuild/config.log" 2>&1 || true
            echo "=== build environment (flags/compilers) ==="
            env | grep -Ei 'flags|(^|_)cc=|cxx|ld_|conda|path=' || true
            exit 1
          fi
          bash tools/android/build_bionic.sh

      - name: Build debug APK (side-by-side install, debug signature)
        shell: bash -el {0}
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.internal.http.connectionTimeout=60000
            -Dorg.gradle.internal.http.socketTimeout=60000
        run: |
          bash tools/android/debug/stage_bionic_runtime.sh
          ok=0
          for attempt in 1 2 3; do
            args=(:app:assembleDebug)
            if (( attempt > 1 )); then args+=(--refresh-dependencies); fi
            if android-launcher/gradlew -p android-launcher "${args[@]}"; then
              ok=1
              break
            fi
            echo "Gradle assembleDebug failed (attempt $attempt/3); retrying" >&2
            # foojay-resolver solo auto-instala JDKs; el CI ya usa Temurin 17 de setup-java.
            # Si el Plugin Portal falla, quitarlo evita bloquear el build por un plugin inerte.
            if grep -q 'foojay-resolver-convention' android-launcher/settings.gradle.kts; then
              echo "Removing foojay-resolver-convention (unused in CI) and retrying" >&2
              sed -i '/foojay-resolver-convention/d' android-launcher/settings.gradle.kts
            fi
            rm -rf "$HOME/.gradle/caches/modules-2/metadata-"* || true
            sleep 20
          done
          [ "$ok" = 1 ] || exit 1
          mkdir -p out/apk
          cp android-launcher/app/build/outputs/apk/debug/*.apk out/apk/GodOfWar3-debug.apk
          sha256sum out/apk/GodOfWar3-debug.apk > out/apk/GodOfWar3-debug.apk.sha256

      - name: Build release APK (dev-key signed)
        # Se omite si las librerias Steam no se pudieron bajar: build_release_apk.sh
        # las exige, pero el APK debug (stub) ya cubre la prueba de vibracion.
        if: ${{ hashFiles('.local-deps/android/steam-libs/jars.txt') != '' }}
        shell: bash -el {0}
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.internal.http.connectionTimeout=60000
            -Dorg.gradle.internal.http.socketTimeout=60000
        run: |
          ok=0
          for attempt in 1 2 3; do
            if bash tools/android/apk/build_release_apk.sh; then ok=1; break; fi
            echo "Release APK failed (attempt $attempt/3); retrying" >&2
            rm -rf "$HOME/.gradle/caches/modules-2/metadata-"* || true
            sleep 20
          done
          [ "$ok" = 1 ] || exit 1
          cp "out/release/God of War III-bionic-"*.apk out/apk/GodOfWar3-release-devkey.apk
          sha256sum out/apk/GodOfWar3-release-devkey.apk > out/apk/GodOfWar3-release-devkey.apk.sha256
          ls -lh out/apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gow3-apk-${{ github.sha }}
          path: |
            out/apk/*.apk
            out/apk/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish test pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-test-${{ github.run_number }}
          name: "APK de prueba #${{ github.run_number }} (${{ github.sha }})"
          prerelease: true
          body: |
            Build de prueba con los cambios de la rama `${{ github.ref_name }}` (incluye la
            vibracion de mandos). Firmado con clave de desarrollo: no es la app oficial.

            - `GodOfWar3-debug.apk`: se instala junto a la app oficial (paquete `.debug`).
            - `GodOfWar3-release-devkey.apk`: mismo paquete que la oficial; desinstala antes
              (se pierden los datos/saves de la app). Puede faltar si el runner no pudo bajar
              las librerias de Steam en ese intento.

            Prueba: Ajustes -> Button mapping -> "Test vibration", o menu en juego ->
            Controls -> "Test vibration".
          files: |
            out/apk/*.apk
            out/apk/*.sha256
